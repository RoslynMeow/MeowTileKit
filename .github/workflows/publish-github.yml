# 合并到 main 后，自动把版本号有更新的包发布到 GitHub Packages（npm registry）。
# 无需 tag：逐个读取 packages/*/package.json 的 version，
# 若该版本在 GitHub Packages 尚不存在，则以作用域名 @roslynmeow/<pkg> 发布，否则跳过。
name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@roslynmeow'

      - run: npm ci
      - run: npm run build

      - name: Publish new versions to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_if_new() {
            local dir="$1"
            local pkg="$2"
            local ver scoped
            ver=$(node -p "require('./$dir/package.json').version")
            scoped="@roslynmeow/$pkg"
            if npm view "$scoped@$ver" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "skip  $scoped@$ver (already published)"
            else
              echo "publish  $scoped@$ver"
              cd "$dir"
              npm pkg set name="$scoped"
              npm publish
              cd -
            fi
          }

          publish_if_new packages/core meow-tile-kit-core
          publish_if_new packages/ui   meow-tile-kit-ui
          publish_if_new packages/meta meow-tile-kit
