<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowTileKit · 多源地图瓦片</title>
  <meta name="description" content="多源地图瓦片切换库，支持 WGS-84 / GCJ-02 / BD-09 坐标系统与多种坐标编码格式。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --brand: #6c5ce7;
      --brand-2: #4a9eff;
      --brand-3: #39d3c3;
      --ink: #e8e8f0;
      --muted: #8a8a9e;
      --panel: rgba(16, 16, 28, .82);
      --stroke: rgba(255, 255, 255, .09);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", sans-serif;
      background: #07070d;
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0b0b14
    }

    /* keep Leaflet controls clear of the brand card */
    .leaflet-top.leaflet-left {
      margin-top: 208px
    }

    .leaflet-control-zoom a {
      background: var(--panel) !important;
      color: var(--ink) !important;
      border-color: var(--stroke) !important;
      backdrop-filter: blur(10px)
    }

    .leaflet-control-zoom a:hover {
      background: rgba(74, 158, 255, .18) !important
    }

    .leaflet-control-attribution {
      background: rgba(10, 10, 18, .7) !important;
      color: var(--muted) !important;
      backdrop-filter: blur(6px)
    }

    .leaflet-control-attribution a {
      color: var(--brand-2) !important
    }

    /* ── brand card ── */
    .brand {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 500;
      width: 268px;
      padding: 18px 18px 16px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
      animation: rise .6s cubic-bezier(.2, .8, .2, 1) both
    }

    .brand::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(108, 92, 231, .6), rgba(74, 158, 255, .35), transparent 70%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      display: grid;
      place-items: center;
      box-shadow: 0 6px 18px rgba(108, 92, 231, .45);
      flex-shrink: 0
    }

    .brand-mark svg {
      width: 20px;
      height: 20px
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
      background: linear-gradient(120deg, #a99cff, var(--brand-2) 55%, var(--brand-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .brand p.sub {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 0 12px;
      line-height: 1.6
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px
    }

    .chip {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      color: #b9b9cc;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--stroke)
    }

    .links {
      display: flex;
      gap: 8px
    }

    .link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 10px;
      color: #cdcdda;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--stroke);
      transition: all .18s
    }

    .link:hover {
      color: #fff;
      background: rgba(74, 158, 255, .16);
      border-color: rgba(74, 158, 255, .4)
    }

    .link.primary {
      color: #fff;
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      border: none
    }

    .link.primary:hover {
      filter: brightness(1.12)
    }

    /* ── hint ── */
    .hint {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      color: #d2d2e0;
      background: var(--panel);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .45);
      white-space: nowrap;
      animation: rise .6s .15s cubic-bezier(.2, .8, .2, 1) both
    }

    .hint kbd {
      font-family: inherit;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(74, 158, 255, .16);
      border: 1px solid rgba(74, 158, 255, .3);
      color: #a9d0ff
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand-3);
      box-shadow: 0 0 0 0 rgba(57, 211, 195, .6);
      animation: pulse 2s infinite
    }

    /* ── loading ── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: grid;
      place-items: center;
      background: #07070d;
      transition: opacity .5s ease
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top-color: var(--brand-2);
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(57, 211, 195, .55)
      }

      70% {
        box-shadow: 0 0 0 8px rgba(57, 211, 195, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(57, 211, 195, 0)
      }
    }

    @media (max-width: 560px) {
      .brand {
        width: calc(100vw - 32px);
        left: 16px;
        top: 16px
      }

      .leaflet-top.leaflet-left {
        margin-top: 236px
      }

      .hint {
        font-size: 12px;
        padding: 9px 14px
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <aside class="brand">
    <div class="brand-logo">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z" />
          <path d="M9 3v15M15 6v15" />
        </svg>
      </div>
      <h1>MeowTileKit</h1>
    </div>
    <p class="sub">多源地图瓦片切换库，内置坐标系统转换与多种测量标准编码 / 解码。</p>
    <div class="chips">
      <span class="chip">WGS-84</span>
      <span class="chip">GCJ-02</span>
      <span class="chip">BD-09</span>
      <span class="chip">Geohash</span>
      <span class="chip">UTM</span>
      <span class="chip">Plus Code</span>
    </div>
    <div class="links">
      <a class="link primary" href="https://github.com/DavidMeow/MeowTileKit" target="_blank" rel="noopener">GitHub</a>
      <a class="link" href="https://www.npmjs.com/package/meow-tile-kit" target="_blank" rel="noopener">npm</a>
    </div>
  </aside>

  <div class="hint"><span class="dot"></span>双击地图打开坐标面板，在「定位」输入任意坐标即可跳转</div>

  <div id="loading"><div class="spinner"></div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 本地构建优先（便于本地预览），在线 Demo 回退到 CDN -->
  <script src="../package/dist/index.global.js"></script>
  <script>
    if (!window.MeowTileKit) {
      document.write('<script src="https://unpkg.com/meow-tile-kit"><\/script>')
    }
  </script>
  <script>
    (function () {
      'use strict'
      const loading = document.getElementById('loading')
      const hide = () => loading.classList.add('hide')

      try {
        const { createMap } = window.MeowTileKit
        createMap('map', { source: 'amap' })
        setTimeout(hide, 400)
      } catch (err) {
        console.error(err)
        loading.innerHTML = '<div style="color:#ff9a9a;font-size:14px">地图加载失败，请检查网络</div>'
      }
    })()
  </script>
</body>

</html>
