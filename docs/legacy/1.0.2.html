<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeowTileKit 1.0.2（旧版）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0
    }

    #map {
      width: 100%;
      height: 100%
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/meow-tile-kit@1.0.2/dist/index.global.js"></script>
  <script>
    // 旧版 API（单包）：一行创建
    window.MeowTileKit.createMap('map', { source: 'amap' })
  </script>
</body>

</html>
